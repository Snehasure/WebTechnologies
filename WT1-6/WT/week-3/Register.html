<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration - Book Haven</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

    <h2>User Registration</h2>

    <form id="registrationForm">

        <label>Username:</label>
        <input type="text" id="username" placeholder="Enter Username">
        <small class="error" id="usernameError"></small>

        <label>Email:</label>
        <input type="email" id="registerEmail" placeholder="Enter Email">
        <small class="error" id="registerEmailError"></small>

        <label>Password:</label>
        <input type="password" id="password" placeholder="Enter Password">
        <small class="error" id="passwordError"></small>

        <label>Confirm Password:</label>
        <input type="password" id="confirmPassword" placeholder="Confirm Password">
        <small class="error" id="confirmPasswordError"></small>

        <button type="submit">Register</button>

    </form>

    <p>
        Forgot Password?
        <a href="forgot-password.html">Reset Here</a>
    </p>

    <p>
        <a href="books.html">View Books</a>
    </p>

</div>

<script src="script.js"></script>

</body>
</html>
