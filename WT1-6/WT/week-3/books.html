<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Book Loading</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="book-container">

    <div class="navigation">

        <h2>Books</h2>

        <button onclick="loadBook('book1')">Book 1</button>
        <button onclick="loadBook('book2')">Book 2</button>
        <button onclick="loadBook('book3')">Book 3</button>

    </div>

    <div class="content" id="contentFrame">

        <h2>Book Details</h2>
        <p>Click on a book to view details.</p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
